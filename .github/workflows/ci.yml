name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    name: Build & test (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CoreCage.sln

      - name: Build
        run: dotnet build CoreCage.sln -c Release --no-restore

      - name: Test
        run: dotnet test CoreCage.sln -c Release --no-build
